<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flappy Bird</title>
    <style>
        body {
            text-align: center;
            background-color: skyblue;
        }
        canvas {
            background-color: lightgreen;
            display: block;
            margin: auto;
        }
    </style>
</head>
<body>
    <h1>Flappy Bird</h1>
    <p>Press SPACE to jump</p>
    <canvas id="gameCanvas" width="400" height="500"></canvas>
    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        let bird = { x: 50, y: 150, radius: 15, velocity: 0, gravity: 0.5, lift: -10 };
        let pipes = [];
        let score = 0;
        let gameOver = false;

        function drawBird() {
            ctx.beginPath();
            ctx.arc(bird.x, bird.y, bird.radius, 0, Math.PI * 2);
            ctx.fillStyle = "yellow";
            ctx.fill();
            ctx.stroke();
        }

        function drawPipes() {
            pipes.forEach(pipe => {
                ctx.fillStyle = "green";
                ctx.fillRect(pipe.x, 0, pipe.width, pipe.top);
                ctx.fillRect(pipe.x, pipe.bottom, pipe.width, canvas.height - pipe.bottom);
            });
        }

        function update() {
            if (gameOver) return;
            bird.velocity += bird.gravity;
            bird.y += bird.velocity;

            if (bird.y + bird.radius >= canvas.height || bird.y - bird.radius <= 0) {
                gameOver = true;
            }

            if (frames % 100 === 0) {
                let gap = 120;
                let topHeight = Math.floor(Math.random() * (canvas.height / 2));
                pipes.push({ x: canvas.width, width: 40, top: topHeight, bottom: topHeight + gap });
            }

            pipes.forEach(pipe => {
                pipe.x -= 2;
                if (pipe.x + pipe.width < 0) {
                    pipes.shift();
                    score++;
                }

                if (
                    bird.x + bird.radius > pipe.x && bird.x - bird.radius < pipe.x + pipe.width &&
                    (bird.y - bird.radius < pipe.top || bird.y + bird.radius > pipe.bottom)
                ) {
                    gameOver = true;
                }
            });
        }

        function drawScore() {
            ctx.fillStyle = "black";
            ctx.font = "20px Arial";
            ctx.fillText("Score: " + score, 20, 30);
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawBird();
            drawPipes();
            drawScore();
        }

        function gameLoop() {
            update();
            draw();
            if (!gameOver) {
                requestAnimationFrame(gameLoop);
            } else {
                ctx.fillStyle = "red";
                ctx.font = "30px Arial";
                ctx.fillText("Game Over", canvas.width / 3, canvas.height / 2);
            }
        }

        document.addEventListener("keydown", function (event) {
            if (event.code === "Space" && !gameOver) {
                bird.velocity = bird.lift;
            }
        });

        let frames = 0;
        setInterval(() => frames++, 20);
        gameLoop();
    </script>
</body>
</html>
